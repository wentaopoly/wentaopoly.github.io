title: Wentao Sun
url: https://wentaopoly.github.io
baseurl: ""
languages: [en, zh, fr]

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap

include:
  - .nojekyll

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - visitor-map-worker
  - vendor

# Cloudflare Worker in visitor-map-worker/; it only accepts requests from https://wentaopoly.github.io.
visitor_map:
  api_url: https://visitor-map-api.wentaosun549.workers.dev
  track_interval_hours: 6

defaults:
  - scope: { path: "" }
    values: { layout: page, lang: en }
  - scope: { path: "zh" }
    values: { lang: zh }
  - scope: { path: "fr" }
    values: { lang: fr }
