name: Deploy site

# Builds the Jekyll site and publishes _site/ to the gh-pages branch,
# which GitHub Pages serves (Settings → Pages → branch gh-pages, folder /).
on:
  push:
    branches: [main]
    paths-ignore:
      - "visitor-map-worker/**"
      - ".github/workflows/deploy-visitor-map-worker.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
