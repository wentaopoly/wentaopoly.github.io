experience:
  - years: "2025 –"
    ongoing: true
    place: { en: "Paris, France", zh: "法国巴黎", fr: "Paris, France" }
    when: { en: "Mar – Oct 2025; Feb 2026 – present", zh: "2025.03 – 2025.10；2026.02 – 至今", fr: "mars – oct. 2025 ; févr. 2026 – aujourd’hui" }
    what: { en: "Research intern, then CIFRE PhD researcher", zh: "AI 研究实习生，后为 CIFRE 博士研究", fr: "Stagiaire de recherche, puis doctorant CIFRE" }
    where: { en: "Nokia Bell Labs, Paris", zh: "诺基亚贝尔实验室，巴黎", fr: "Nokia Bell Labs, Paris" }
    notes:
      en:
        - "Causal deduction from correlations (Corr2Cause): a claim has to hold in every DAG of a Markov equivalence class, a global question that free-form chain-of-thought tends to reduce to local pattern matching."
        - "Structured Thinking: the model first writes a typed, schema-constrained CPDAG summary (constrained decoding or tool calling), then answers against that graph. No fine-tuning, no symbolic solver."
        - "With Qwen3.5-27B, F1 rises from 73.0 to 86.4 over a strong baseline that already has PC-algorithm instructions (+13.4 points, McNemar p = 2.4 × 10⁻⁶; +8.1 ± 5.3 over three seeds). The gain holds on paraphrased data and on GPT-5.4-mini."
        - "The graph is actually used: scrambling it costs 12.0 points of F1, and 75.9% of the graphs equal the reference CPDAG. Published at NeurIPS 2026."
      zh:
        - "研究由相关性推出因果结论的任务（Corr2Cause）：结论须在马尔可夫等价类的每一个 DAG 中都成立，是全局性判断，而自由形式的思维链常把它简化成局部模式匹配。"
        - "提出 Structured Thinking 两轮流程：第一轮让模型写出带类型、受 schema 约束的 CPDAG 摘要（开源模型用约束解码，API 模型用工具调用），第二轮对照这张图作答；不微调，也不调用符号求解器。"
        - "相比同样给出 PC 算法指导的强基线，Qwen3.5-27B 的 F1 由 73.0 提升到 86.4（+13.4 个百分点，McNemar p = 2.4 × 10⁻⁶；三个种子平均 +8.1 ± 5.3）；在改写后的测试集和 GPT-5.4-mini 上同样有效。"
        - "模型确实用到了这张图：打乱图后 F1 下降 12.0 个百分点；75.9% 的图与参考 CPDAG 完全一致。论文发表于 NeurIPS 2026。"
      fr:
        - "Déduction causale à partir de corrélations (Corr2Cause) : une affirmation doit valoir dans chaque DAG d’une classe d’équivalence de Markov, une question globale que le raisonnement libre en chaîne ramène souvent à de la reconnaissance de motifs locaux."
        - "Structured Thinking : le modèle écrit d’abord un résumé CPDAG typé et contraint par un schéma (décodage contraint ou appel d’outil), puis répond en s’appuyant sur ce graphe. Ni fine-tuning ni solveur symbolique."
        - "Avec Qwen3.5-27B, le F1 passe de 73,0 à 86,4 face à une base solide qui dispose déjà des instructions de l’algorithme PC (+13,4 points, McNemar p = 2,4 × 10⁻⁶ ; +8,1 ± 5,3 sur trois graines). Le gain se maintient sur des données paraphrasées et avec GPT-5.4-mini."
        - "Le graphe est réellement utilisé : le brouiller coûte 12,0 points de F1, et 75,9 % des graphes sont identiques au CPDAG de référence. Publié à NeurIPS 2026."

