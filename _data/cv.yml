  - label: { en: "Research", zh: "研究方法", fr: "Recherche" }
    value:
      en: "Evaluating LLM reasoning (ablations, paired significance tests, repeated seeds); causal discovery (PC algorithm, CPDAGs)"
      zh: "大模型推理能力评测（消融、配对检验、多种子重复）；因果发现（PC 算法、CPDAG）"
      fr: "Évaluation du raisonnement des LLM (ablations, tests appariés, graines répétées) ; découverte causale (algorithme PC, CPDAG)"
  - label: { en: "Language models", zh: "大模型", fr: "Modèles de langage" }
    value:
      en: "Constrained decoding and structured output, tool calling, coding agents and MCP, RAG, LoRA fine-tuning, serving with vLLM"
      zh: "约束解码与结构化输出、工具调用、编程智能体与 MCP、RAG、LoRA 微调、vLLM 部署"
      fr: "Décodage contraint et sorties structurées, appels d’outils, agents de code et MCP, RAG, fine-tuning LoRA, service avec vLLM"
  - label: { en: "Engineering", zh: "工程", fr: "Ingénierie" }
    value:
      en: "Python, C++; PyTorch, Transformers; Slurm GPU clusters, Docker, Dagster, Kafka, HDFS"
      zh: "Python、C++；PyTorch、Transformers；Slurm GPU 集群、Docker、Dagster、Kafka、HDFS"
      fr: "Python, C++ ; PyTorch, Transformers ; clusters GPU Slurm, Docker, Dagster, Kafka, HDFS"

