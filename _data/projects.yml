- slug: acn
  cover: acn
  period: "2026"
  title: { en: "Do shared notes help a coding agent?", zh: "共享笔记能帮编程智能体吗？", fr: "Des notes partagées aident-elles un agent de code ?" }
  summary:
    en: Evaluating Agent Claim Network on 111 DeepSWE tasks. Fetching claims on demand passed 10 more tasks with 16% fewer input tokens; not yet significant.
    zh: 在 111 道 DeepSWE 任务上评测 Agent Claim Network。按需取用 claim 多通过 10 题、输入 token 少 16%，但还不显著。
