- slug: midnight-restart
  cover: midnight
  period: "2026"
  title: { en: "The worker that stopped every midnight", zh: "每到午夜就停摆的进程", fr: "Le processus qui s’arrêtait à minuit" }
  summary:
    en: A long-running browser-automation worker that hung at every scheduled restart, and the two stacked asyncio deadlocks behind it.
    zh: 一个长期运行的浏览器自动化进程，每次定时重启都会卡死，背后是两层叠在一起的 asyncio 死锁。
    fr: Un processus d’automatisation de navigateur qui se bloquait à chaque redémarrage programmé, et les deux interblocages asyncio empilés qui l’expliquaient.
- slug: datadig
  cover: datadig
  period: 2025–2026
  title: { en: "Keeping news clusters stable", zh: "让新闻聚类保持稳定", fr: "Des clusters d’actualités qui restent stables" }
  summary:
    en: Re-clustering a stream of financial news every few minutes without breaking the identity of the stories it already tracks.
    zh: 每隔几分钟对金融新闻流重新聚类，同时不打断已经在追踪的事件。
    fr: Regrouper à nouveau un flux d’actualités financières toutes les quelques minutes sans casser l’identité des sujets déjà suivis.

