{%- comment -%}
A three-node graph A, B, C in a row. include.ab / include.bc: "r" (left to right),
"l" (right to left) or "u" (undirected). Arrowhead marker is defined once in toy.html.
{%- endcomment -%}
<svg class="g3" viewBox="0 0 150 44" role="img" aria-label="{{ include.label }}">
  {%- case include.ab %}
  {%- when "r" %}<line x1="32" y1="22" x2="62" y2="22" marker-end="url(#toy-arrow)"/>
  {%- when "l" %}<line x1="63" y1="22" x2="33" y2="22" marker-end="url(#toy-arrow)"/>
  {%- else %}<line x1="32" y1="22" x2="63" y2="22"/>
  {%- endcase %}
  {%- case include.bc %}
  {%- when "r" %}<line x1="87" y1="22" x2="117" y2="22" marker-end="url(#toy-arrow)"/>
  {%- when "l" %}<line x1="118" y1="22" x2="88" y2="22" marker-end="url(#toy-arrow)"/>
  {%- else %}<line x1="87" y1="22" x2="118" y2="22"/>
  {%- endcase %}
  <circle cx="20" cy="22" r="11"/><text x="20" y="22">A</text>
  <circle cx="75" cy="22" r="11"/><text x="75" y="22">B</text>
  <circle cx="130" cy="22" r="11"/><text x="130" y="22">C</text>
</svg>
