{%- assign s = site.data.cpdag[page.lang] -%}
<figure class="video" id="video">
  <video controls preload="metadata" playsinline poster="/assets/img/cpdag/poster.jpg" width="1280" height="720">
    <source src="/assets/video/cpdag-explainer.mp4" type="video/mp4">
    {%- for lang in site.languages %}
    <track kind="subtitles" srclang="{{ lang }}" label="{{ s.subs[lang] }}" src="/assets/video/cpdag-explainer.{{ lang }}.vtt"{% if lang == page.lang and lang != "en" %} default{% endif %}>
    {%- endfor %}
    <p>{{ s.video_fallback }}</p>
  </video>
  <figcaption>{{ s.video_label }}</figcaption>
</figure>
