{%- assign prefix = "" -%}
{%- if page.lang != "en" -%}{%- assign prefix = "/" | append: page.lang -%}{%- endif -%}
<div class="cards">
  {%- for p in site.data.projects %}
  <article class="card">
    <a href="{{ prefix }}/projects/{{ p.slug }}/">
      <div class="card-media"><img src="/assets/img/covers/{{ p.cover }}-800.jpg" srcset="/assets/img/covers/{{ p.cover }}-800.jpg 800w, /assets/img/covers/{{ p.cover }}.jpg 1600w" sizes="(max-width: 760px) 100vw, 560px" alt="" loading="lazy" width="800" height="450"></div>
      <h3>{{ p.title[page.lang] }}</h3>
      <p>{{ p.summary[page.lang] }}</p>
      <span class="when">{{ p.period }}</span>
    </a>
  </article>
  {%- endfor %}
</div>
